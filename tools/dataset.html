<!doctype html><meta charset=utf-8>
<script type=module>
import { makeBatch } from './synth.js';
const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
window.batch = (seed, n) => { const r = makeBatch(seed, n); return { X: b64(r.X), y: b64(r.y), n: r.n, D: r.D }; };
window.ready = true;
</script>
